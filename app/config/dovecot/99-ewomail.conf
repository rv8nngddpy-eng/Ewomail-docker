# EwoMail 覆盖配置（最后加载，优先级最高）

protocols = imap pop3 lmtp

mail_location = maildir:~/Maildir
mail_privileged_group = vmail
first_valid_uid = 5000
last_valid_uid = 5000

# 强制加密后才允许明文密码认证
disable_plaintext_auth = yes
auth_mechanisms = plain login
auth_username_format = %Lu

ssl = required
ssl_cert = </ewomail/ssl/fullchain.pem
ssl_key = </ewomail/ssl/privkey.pem
ssl_min_protocol = TLSv1.2
ssl_prefer_server_ciphers = yes

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 110
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

# Postfix 通过这两个 socket 调用 Dovecot 的 SASL 与 LMTP
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}

service auth-worker {
  user = root
}

passdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

userdb {
  driver = sql
  args = /etc/dovecot/dovecot-sql.conf.ext
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

protocol imap {
  mail_max_userip_connections = 20
}

plugin {
  sieve = ~/.dovecot.sieve
  sieve_dir = ~/sieve
}

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Trash {
    auto = subscribe
    special_use = \Trash
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}

log_path = /var/log/dovecot.log
auth_verbose = yes
auth_debug = no
mail_debug = no
