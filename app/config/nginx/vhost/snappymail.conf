# SnappyMail 网页邮箱
# 8000 明文端口只做跳转，实际访问走 7000（HTTPS）
server {
    listen 8000;
    server_name _;

    location / {
        return 301 https://$host:7000$request_uri;
    }
}

server {
    listen 7000 ssl;
    server_name _;

    ssl_certificate     /ewomail/ssl/fullchain.pem;
    ssl_certificate_key /ewomail/ssl/privkey.pem;

    root /ewomail/www/snappymail;
    index index.php;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    # 配置与数据目录绝对不可通过 HTTP 访问
    location ^~ /data {
        deny all;
        return 403;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ /\. {
        deny all;
    }
}
