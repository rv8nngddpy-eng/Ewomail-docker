# EwoMail 后台管理
# 8010 明文端口只做跳转，实际访问走 7010（HTTPS）
server {
    listen 8010;
    server_name _;

    location / {
        return 301 https://$host:7010$request_uri;
    }
}

server {
    listen 7010 ssl;
    server_name _;

    ssl_certificate     /ewomail/ssl/fullchain.pem;
    ssl_certificate_key /ewomail/ssl/privkey.pem;

    root /ewomail/www/ewomail-admin;
    index index.php;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer-when-downgrade;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~* /(cache|lib|upload|core|api|module|templates)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }
}
