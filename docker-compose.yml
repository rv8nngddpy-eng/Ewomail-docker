name: ewomail

services:
  db:
    image: mariadb:10.11
    container_name: ewomail-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ewomail
      MARIADB_USER: ewomail
      MARIADB_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --max-connections=80
      - --skip-name-resolve
    volumes:
      - ./data/mysql:/var/lib/mysql
      - ./install.sql:/docker-entrypoint-initdb.d/10-install.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 18
    mem_limit: 320m

  clamav:
    image: clamav/clamav:stable
    container_name: ewomail-clamav
    restart: unless-stopped
    environment:
      CLAMAV_NO_MILTERD: "true"
      TZ: Asia/Shanghai
    volumes:
      - ./data/clamav:/var/lib/clamav
    # ClamAV 加载全量病毒库时内存峰值约 1.2G，1G 内存机器务必配合 swap
    mem_limit: 1400m

  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: ewomail-app
    hostname: ${MAIL_HOSTNAME}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_started
    environment:
      DOMAIN: ${DOMAIN}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME}
      DB_HOST: db
      DB_NAME: ewomail
      DB_USER: ewomail
      DB_PASSWORD: ${DB_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "143:143"
      - "993:993"
      - "110:110"
      - "995:995"
      - "8000:8000"
      - "8010:8010"
      - "7000:7000"
      - "7010:7010"
    volumes:
      - ./data/mail:/ewomail/mail
      - ./data/dkim:/ewomail/dkim
      - ./data/ssl:/ewomail/ssl
      - ./data/log:/var/log
    mem_limit: 800m
